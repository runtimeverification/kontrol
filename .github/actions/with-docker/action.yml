name: 'With Docker'
description: 'Run a given stage with Docker Image'
inputs:
  container-name:
    description: 'Docker container name to use'
    required: true
  tag-name:
    description: 'Docker image tag to use'
    required: false
    default: runtimeverificationinc/kontrol
  llvm:
    description: 'LLVM version to use.'
    required: false
    default: 14
  dockerfile:
    description: 'Hardcode the path of the dockerfile to use.'
    required: false
    default: '.github/workflows/Dockerfile'
runs:
  using: 'composite'
  steps:
  # The Dockerfile's first stage is `FROM ghcr.io/foundry-rs/foundry`, a
  # third-party org's public image. Self-hosted runners can carry a stale
  # ghcr.io credential in their docker config; BuildKit then sends it when
  # fetching the pull token and ghcr.io rejects it ("denied: denied") instead
  # of falling back to anonymous. Log in with a fresh token so the credential
  # is always valid (a valid GITHUB_TOKEN can pull public images from any org).
  - name: 'Log in to ghcr.io'
    uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ github.token }}
  - name: 'Set up Docker'
    env:
      CONTAINER_NAME: ${{ inputs.container-name }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      LLVM_VERSION: ${{ inputs.llvm }}
      TAG_NAME: ${{ inputs.tag-name }}
    shell: bash {0}
    run: |
      set -euxo pipefail

      IMAGE_USER=github-user
      IMAGE_GROUP=${IMAGE_USER}
      Z3_VERSION=$(cat deps/z3)
      K_VERSION=$(cat deps/k_release)
      UV_VERSION=$(cat deps/uv_release)
      USER_ID=1000
      GROUP_ID=${USER_ID}

      docker build . --file "${DOCKERFILE}"         \
        --tag "${TAG_NAME}"                         \
        --build-arg USER_ID="${USER_ID}"            \
        --build-arg GROUP_ID="${GROUP_ID}"          \
        --build-arg IMAGE_USER="${IMAGE_USER}"      \
        --build-arg IMAGE_GROUP="${IMAGE_GROUP}"    \
        --build-arg K_VERSION="${K_VERSION}"        \
        --build-arg Z3_VERSION="${Z3_VERSION}"      \
        --build-arg LLVM_VERSION="${LLVM_VERSION}"  \
        --build-arg UV_VERSION="${UV_VERSION}"

      docker rm --force "${CONTAINER_NAME}" || true

      docker run                                  \
        --name "${CONTAINER_NAME}"                \
        --rm                                      \
        --interactive                             \
        --tty                                     \
        --detach                                  \
        --user root                               \
        --workdir "/home/${IMAGE_USER}/workspace" \
        "${TAG_NAME}"

      docker cp ./. "${CONTAINER_NAME}":"/home/${IMAGE_USER}/workspace"
      docker exec "${CONTAINER_NAME}" chown -R "${IMAGE_USER}:${IMAGE_GROUP}" "/home/${IMAGE_USER}"
